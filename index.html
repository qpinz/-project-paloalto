<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>個人專案畫廊展示</title>

    <style>
        /* =========================================
           1. 基礎設定
           ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: "Helvetica Neue", Arial, sans-serif; 
            background-color: #f4f4f4; 
            color: #555; 
            line-height: 1.6; 
            overflow-x: hidden;
            padding-bottom: 20px; 
        }
        a { text-decoration: none; color: inherit; }

        /* =========================================
           2. 🌟 開場動畫 🌟 
           ========================================= */
        .splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #63362B; 
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; overflow: hidden; 
            animation: splashBgFade 0.6s ease-in-out 2.5s forwards;
        }
        .splash-icons {
            position: absolute; top: 30px; left: 30px;
            font-family: 'Pixelify Sans', monospace; font-size: 26px;
            color: #D8B4B8; letter-spacing: 12px; opacity: 0;
            animation: fadeProject 2.5s ease-in-out forwards;
        }
        .splash-project {
            position: absolute; color: #D8B4B8; 
            font-family: 'Pixelify Sans', monospace; font-size: 15vw; 
            letter-spacing: 5px; font-weight: 700; opacity: 0;
            animation: fadeProject 2.5s ease-in-out forwards;
        }
        .splash-pin {
            position: absolute; color: #fff; font-family: 'Pixelify Sans', monospace; 
            font-size: 6vw; font-weight: 900; letter-spacing: 15px; margin-right: -15px; opacity: 0;
            text-shadow: 0px 1px 0px #d4d4d4, 0px 2px 0px #c4c4c4, 0px 3px 0px #b4b4b4, 0px 4px 0px #a4a4a4, 0px 5px 0px #949494, 0px 6px 0px #848484, 0px 15px 20px rgba(0,0,0,0.8);
            animation: zoomPin 1.5s cubic-bezier(0.7, 0, 0.3, 1) 0.5s forwards;
        }
        @keyframes splashBgFade { 0% { opacity: 1; visibility: visible; } 100% { opacity: 0; visibility: hidden; pointer-events: none; } }
        @keyframes fadeProject { 0% { opacity: 0; transform: translateY(10px); } 20% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-10px); } }
        @keyframes zoomPin { 0% { opacity: 0; transform: scale(0.8); } 30% { opacity: 1; transform: scale(1); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(3.5); } }

        /* =========================================
           3. 大型橫幅 (Hero Banner) 
           ========================================= */
        .hero {
            position: relative; width: 100%; height: 45vh; min-height: 380px; 
            background-color: #E8E6E1; margin-bottom: 40px; overflow: hidden; 
        }
        #pachinko-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #pachinko-canvas canvas { display: block; width: 100%; height: 100%; } /* 給內建畫布的設定 */

        .hero-marquee-container {
            position: absolute; bottom: 0; left: 0; width: 100%; background: #111; padding: 12px 0; border-top: 2px solid #00e5ff; overflow: hidden; z-index: 15; 
        }
        .marquee-track { display: flex; width: max-content; animation: scroll 50s linear infinite; }
        .marquee-track:hover { animation-play-state: paused; }
        .marquee-item { padding: 0 40px; display: flex; align-items: center; justify-content: center; }
