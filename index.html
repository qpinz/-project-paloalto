<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡畫廊風格展示</title>
    <style>
        /* 基礎設定 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: #fafafa; color: #333; line-height: 1.5; }
        a { text-decoration: none; color: #888; font-size: 12px; }
        ul { list-style: none; }

        /* 頂部導覽列 */
        header { display: flex; align-items: center; padding: 20px 40px; background: #fff; }
        .logo { display: flex; align-items: center; gap: 5px; margin-right: 40px; }
        .logo span { display: inline-block; width: 15px; height: 15px; background: #aebdbb; }
        .logo .circle { border-radius: 50%; }
        .logo .triangle { background: transparent; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 15px solid #aebdbb; }
        .nav-links { display: flex; gap: 20px; font-size: 14px; color: #666; letter-spacing: 1px; }

        /* 右側懸浮選單 */
        .floating-menu { position: fixed; right: 20px; top: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 100; }
        .floating-menu .icon { width: 45px; height: 45px; border-radius: 50%; background: #fff; border: 1px solid #ddd; display: flex; justify-content: center; align-items: center; color: #888; cursor: pointer; transition: 0.3s; }
        .floating-menu .icon:hover { border-color: #aebdbb; }

        /* 分類頁籤 (PC / SP) */
        .tabs { display: flex; width: 100%; max-width: 1200px; margin: 20px auto; background: #fff; border: 1px solid #eee; }
        .tab { flex: 1; text-align: center; padding: 20px 0; letter-spacing: 2px; color: #999; cursor: pointer; }
        .tab.active { background-color: #b7b2a3; color: #fff; position: relative; }
        /* 頁籤下方的三角形箭頭 */
        .tab.active::after {
            content: ''; position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%);
            border-width: 15px 15px 0; border-style: solid; border-color: #b7b2a3 transparent transparent transparent;
        }

        /* 網格展示區 */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        
        /* 卡片設計 */
        .card { background: #fff; padding-bottom: 15px; }
        .card-image { position: relative; width: 100%; aspect-ratio: 4/3; overflow: hidden; background: #eee; }
        .card-image img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .card:hover .card-image img { transform: scale(1.02); }

        /* 卡片上的懸浮圓形按鈕 */
        .circle-btn { position: absolute; background: #fff; border: 1px solid #ddd; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #666; font-size: 12px; cursor: pointer; }
        .btn-left { bottom: -20px; left: 15px; width: 60px; height: 60px; text-align: center; line-height: 1.2; padding: 5px; z-index: 10; }
        .btn-right-1 { bottom: 35px; right: 10px; width: 35px; height: 35px; }
        .btn-right-2 { bottom: -10px; right: 10px; width: 35px; height: 35px; z-index: 10; }

        /* 卡片文字資訊 */
        .card-info { padding: 30px 15px 0 15px; }
        .card-title { font-size: 14px; font-weight: normal; margin-bottom: 5px; color: #333; }
        .card-url { display: block; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-tags { font-size: 12px; color: #999; margin-bottom: 8px; }
        .color-dots { display: flex; gap: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
    <header>
        <div class="logo">
            <span class="circle"></span>
            <span class="triangle"></span>
        </div>
        <div class="nav-links">
            <span>デザインのこと - Web design gallery</span>
        </div>
    </header>

    <!-- 右側懸浮選單 -->
    <div class="floating-menu">
        <div class="icon">🔍</div>
        <div class="icon">▼</div>
        <div class="icon">♡</div>
    </div>

    <!-- 分類頁籤 -->
    <div class="tabs">
        <div class="tab active">P C</div>
        <div class="tab">S P</div>
    </div>

    <!-- 網格展示區 (替換您的專案) -->
    <main class="gallery">
        
        <!-- 卡片 1 (連結到光電廠作業計畫書) -->
        <article class="card">
            <div class="card-image">
                <!-- 將 href 改為您的 PDF 檔名 -->
                <a href="光電廠_作業計畫書.pdf" target="_blank">
                    <!-- 這裡可以替換成您的預覽圖圖片網址 -->
                    <img src="https://picsum.photos/400/300?random=1" alt="作業計畫書">
                </a>
                <div class="circle-btn btn-left">詳細<br>を見る</div>
                <div class="circle-btn btn-right-1">♡</div>
                <div class="circle-btn btn-right-2">＋</div>
            </div>
            <div class="card-info">
                <h3 class="card-title">光電廠作業計畫書</h3>
                <a href="光電廠_作業計畫書.pdf" class="card-url" target="_blank">點擊開啟 PDF 文件</a>
                <p class="card-tags">#計畫書 #光電產業 #防火牆</p>
                <div class="color-dots">
                    <span class="dot" style="background: #2a6199;"></span>
                    <span class="dot" style="background: #d4a373;"></span>
                </div>
            </div>
        </article>

        <!-- 卡片 2 (連結到光電廠專案簡述) -->
        <article class="card">
            <div class="card-image">
                <a href="光電廠_專案簡述.pdf" target="_blank">
                    <img src="https://picsum.photos/400/300?random=2" alt="專案簡述">
                </a>
                <div class="circle-btn btn-left">詳細<br>を見る</div>
                <div class="circle-btn btn-right-1">♡</div>
                <div class="circle-btn btn-right-2">＋</div>
            </div>
            <div class="card-info">
                <h3 class="card-title">光電廠專案簡述</h3>
                <a href="光電廠_專案簡述.pdf" class="card-url" target="_blank">點擊開啟 PDF 文件</a>
                <p class="card-tags">#專案簡介 #規格說明</p>
                <div class="color-dots">
                    <span class="dot" style="background: #4caf50;"></span>
                    <span class="dot" style="background: #e0e0e0;"></span>
                </div>
            </div>
        </article>

    </main>

</body>
</html>
