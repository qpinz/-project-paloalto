<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTFOLIO | 個人專案畫廊</title>
    <style>
        /* =========================================
           1. 基礎設定與字體
           ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: "Helvetica Neue", "Noto Sans TC", sans-serif; 
            background-color: #313131; /* 完美還原參考圖的深碳灰色 */
            color: #fff; 
            overflow: hidden; /* 隱藏整體捲動條，採橫向/滿版設計 */
        }
        a { text-decoration: none; color: inherit; }

        /* =========================================
           2. 開場動畫幕 (Splash Screen - 對應第一張圖)
           ========================================= */
        .splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #2b2b2b;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            /* 進場停留 2.5秒後，花 0.8秒淡出並隱藏 */
            animation: splashFadeOut 0.8s ease-in-out 2.5s forwards;
        }
        .splash-logo {
            font-size: 55px;
            font-family: "Georgia", serif; /* 帶有優雅感的襯線字體 */
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
        }
        /* 模擬圖片中字體下方的特殊底線設計 */
        .splash-logo::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 10%;
            width: 80%;
            height: 2px;
            background-color: #fff;
        }
        @keyframes splashFadeOut {
            0% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; pointer-events: none; }
        }

        /* =========================================
           3. 主畫面四欄排版 (Main Layout - 對應第二張圖)
           ========================================= */
        .layout-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow-x: auto; /* 若螢幕太小可左右滑動 */
        }
        
        /* 每一欄的共用設計 */
        .panel {
            flex: 1;
            min-width: 280px; /* 確保縮小視窗時不會太擠 */
            height: 100%;
            border-right: 1px solid rgba(255, 255, 255, 0.08); /* 極細的分割線 */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.4s ease;
        }
        .panel:hover {
            background-color: #383838;
        }

        /* 左上角導覽選單 (僅限第一欄) */
        .side-nav {
            position: absolute;
            top: 40px;
            left: 20px;
            font-size: 11px;
            line-height: 2;
            letter-spacing: 1px;
            color: #aaa;
        }
        .side-nav div:hover { color: #fff; cursor: pointer; }

        /* 直書文字設計 */
        .vertical-title {
            writing-mode: vertical-rl; /* 文字直排、由右至左 */
            position: absolute;
            right: 35px;
            top: 40px;
            font-size: 18px;
            letter-spacing: 6px;
            color: #eee;
            font-weight: 300;
        }
        .vertical-subtitle {
            writing-mode: vertical-rl;
            position: absolute;
            right: 70px;
            top: 40px;
            font-size: 14px;
            letter-spacing: 4px;
            color: #888;
        }

        /* 底部專案標籤 */
        .panel-footer {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            font-size: 18px;
            font-family: "Georgia", serif;
            letter-spacing: 1px;
            color: #fff;
        }

        /* 若該欄有多個 PDF (例如光電廠)，顯示的子選單按鈕 */
        .sub-links {
            position: absolute;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            width: 100%;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .panel:hover .sub-links { opacity: 1; }
        .sub-btn {
            font-size: 11px;
            padding: 5px 15px;
            border: 1px solid #777;
            border-radius: 20px;
            color: #ccc;
        }
        .sub-btn:hover { background: #fff; color: #333; }

        /* =========================================
           4. 抽象幾何藝術 (Abstract Geometry)
           ========================================= */
        .art-box {
            width: 180px;
            height: 180px;
            position: relative;
            transition: transform 0.4s ease;
        }
        .panel:hover .art-box {
            transform: scale(1.05); /* 滑過時圖形微放大 */
        }
        /* 共用 SVG 樣式 */
        .art-svg {
            width: 100%;
            height: 100%;
        }
        /* 預設圖形顏色，滑過時亮起參考圖中的「萊姆綠」 */
        .shape-accent { fill: #e0e0e0; transition: fill 0.4s ease; }
        .panel:hover .shape-accent { fill: #ccff33; /* 萊姆綠 */ }
        .shape-gray { fill: #cccccc; }
        .shape-white { fill: #ffffff; }

        /* =========================================
           5. 滿版 PDF 閱讀器 (Overlay)
           ========================================= */
        .pdf-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #2b2b2b;
            z-index: 1000;
            display: none; /* 預設隱藏 */
            flex-direction: column;
        }
        .pdf-header {
            height: 60px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .btn-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 13px;
            letter-spacing: 2px;
            cursor: pointer;
        }
        .btn-close:hover { color: #ccff33; }
        .pdf-iframe {
            flex: 1;
            width: 100%;
            border: none;
            background-color: #fff;
        }
    </style>
</head>
<body>

    <!-- 🌟 開場動畫幕 (Splash Screen) 🌟 -->
    <div class="splash-screen">
        <div class="splash-logo">portfolio</div>
    </div>

    <!-- 🌟 主畫面四欄排版 🌟 -->
    <div class="layout-container">

        <!-- 第 1 欄：導覽選單與封面 -->
        <div class="panel" style="cursor: default;">
            <div class="side-nav">
                <div>WHO WE ARE</div>
                <div>BUSINESS</div>
                <div>STAFF</div>
                <div>WORKS</div>
                <div>RECRUIT</div>
                <div>NEWS</div>
                <div>CONTACT</div>
            </div>
            <!-- 直書標題 -->
            <div class="vertical-title">個人專案畫廊展示</div>
            <div class="vertical-subtitle">可能性を社会に実装する</div>
            
            <!-- 幾何圖形 A -->
            <div class="art-box">
                <svg class="art-svg" viewBox="0 0 100 100">
                    <rect width="100" height="100" fill="#a0a0a0" />
                    <!-- 左半圓白，右半圓萊姆綠 -->
                    <path d="M 50 20 A 30 30 0 0 0 50 80 Z" class="shape-white" />
                    <path d="M 50 20 A 30 30 0 0 1 50 80 Z" class="shape-accent" />
                    <polygon points="0,40 50,50 0,60" class="shape-white" />
                </svg>
            </div>
            <div class="panel-footer">home</div>
        </div>

        <!-- 第 2 欄：自行車專案 -->
        <!-- 點擊整個區塊直接開啟 PDF -->
        <div class="panel" onclick="openPdf('自行車產業_專案敘述.pdf')">
            <div class="vertical-title">自行車產業分析報告</div>
            <div class="vertical-subtitle">供應鏈與市場佈局</div>
            
            <!-- 幾何圖形 B -->
            <div class="art-box">
                <svg class="art-svg" viewBox="0 0 100 100">
                    <rect width="100" height="100" fill="#383838" />
                    <circle cx="50" cy="50" r="45" fill="#e0e0e0" />
                    <circle cx="25" cy="60" r="15" class="shape-white" />
                    <path d="M 40 100 A 40 40 0 0 1 100 40 L 100 100 Z" class="shape-accent" />
                </svg>
            </div>
            <div class="panel-footer">project 01</div>
        </div>

        <!-- 第 3 欄：光電廠專案 (包含兩個 PDF) -->
        <!-- 因為有兩份文件，滑過時會浮現按鈕供選擇 -->
        <div class="panel">
            <div class="vertical-title">光電廠產業專案</div>
            <div class="vertical-subtitle">防火牆升級與無縫遷移</div>
            
            <!-- 子選單：供點擊開啟不同 PDF -->
            <div class="sub-links">
                <div class="sub-btn" onclick="openPdf('光電廠_作業計畫書.pdf')">▶ 作業計畫書</div>
                <div class="sub-btn" onclick="openPdf('光電廠_專案簡述.pdf')">▶ 專案簡述</div>
            </div>

            <!-- 幾何圖形 C -->
            <div class="art-box">
                <svg class="art-svg" viewBox="0 0 100 100">
                    <rect width="100" height="100" fill="#e0e0e0" />
                    <polygon points="0,0 50,50 0,100" class="shape-gray" />
                    <polygon points="50,0 100,50 50,100" class="shape-accent" />
                    <polygon points="0,0 50,0 0,50" class="shape-white" />
                    <polygon points="50,100 100,100 100,50" class="shape-white" />
                </svg>
            </div>
            <div class="panel-footer">project 02</div>
        </div>

        <!-- 第 4 欄：電線電子專案 -->
        <div class="panel" onclick="openPdf('填寫檔名.pdf')">
            <div class="vertical-title">電線電子產業專案報告</div>
            <div class="vertical-subtitle">技術規格與產業分析</div>
            
            <!-- 幾何圖形 D -->
            <div class="art-box">
                <svg class="art-svg" viewBox="0 0 100 100">
                    <rect width="100" height="100" fill="#a0a0a0" />
                    <path d="M 50 20 A 30 30 0 0 0 50 80 Z" class="shape-accent" />
                    <path d="M 50 20 A 30 30 0 0 1 50 80 Z" class="shape-gray" />
                    <polygon points="0,40 50,50 0,60" class="shape-white" />
                </svg>
            </div>
            <div class="panel-footer">project 03</div>
        </div>

    </div>

    <!-- 🌟 滿版 PDF 閱讀器 🌟 -->
    <div id="PDF-Viewer" class="pdf-overlay">
        <div class="pdf-header">
            <button class="btn-close" onclick="closePdf()">✕ CLOSE</button>
        </div>
        <iframe id="pdf-frame" class="pdf-iframe" src=""></iframe>
    </div>

    <!-- 互動腳本 -->
    <script>
        // 開啟 PDF 閱讀器
        function openPdf(pdfFilename) {
            var viewer = document.getElementById('PDF-Viewer');
            viewer.style.display = "flex";
            document.getElementById('pdf-frame').src = pdfFilename;
        }

        // 關閉 PDF 閱讀器
        function closePdf() {
            document.getElementById('PDF-Viewer').style.display = "none";
            document.getElementById('pdf-frame').src = "";
        }
    </script>
</body>
</html>
